version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: cond-postgres
    environment:
      POSTGRES_USER: cond_user
      POSTGRES_PASSWORD: condoo_password
      POSTGRES_DB: cond_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: cond-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data: